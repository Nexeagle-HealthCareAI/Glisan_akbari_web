# Legacy department filters become permanent paths before serving static HTML.
map "$uri?$args" $legacy_care_redirect {
    default "";
    ~^/(?:services|conditions|treatments)(?:/index\.html|/)?\?(?:[^&]*&)*?department=ent(?:&|$) /services/ent;
    ~^/(?:services|conditions|treatments)(?:/index\.html|/)?\?(?:[^&]*&)*?department=general-medicine(?:&|$) /services/general-medicine;
    ~^/(?:services|conditions|treatments)(?:/index\.html|/)?\?(?:[^&]*&)*?department=anesthesiology(?:&|$) /services/anesthesiology;
    ~^/(?:services|conditions|treatments)(?:/index\.html|/)?\?(?:[^&]*&)*?department=neurology(?:&|$) /services/neurology;
    ~^/(?:services|conditions|treatments)(?:/index\.html|/)?\?(?:[^&]*&)*?department=[^&]*(?:&|$) /services/urologist-in-purnia;
}

# Remove the retired department filter while keeping campaign attribution.
map $args $care_remaining_query {
    default "";
    ~^department=[^&]*(?:&(?<care_query_after>.*))?$ $care_query_after;
    ~^(?<care_query_before>.+)&department=[^&]*(?<care_query_tail>&.*)?$ $care_query_before$care_query_tail;
}
map $care_remaining_query $care_query_suffix {
    "" "";
    default ?$care_remaining_query;
}

map $uri $legacy_page_redirect {
    default "";
    ~^/services(?:/index\.html|/)?$ /services/urologist-in-purnia;
    ~^/services/kidney-stone-laser-surgery-pcnl-ursl-rirs(?:/index\.html|/)?$ /services/kidney-stone-treatment-in-purnia;
    ~^/services/prostate-enlargement-bph-treatment(?:/index\.html|/)?$ /services/prostate-treatment-in-purnia;
    ~^/services/urinary-tract-infection-uti-hematuria-care(?:/index\.html|/)?$ /services/urine-infection-treatment-in-purnia;
    ~^/services/male-infertility-varicocele-repair(?:/index\.html|/)?$ /services/male-infertility-treatment-in-purnia;
    ~^/services/erectile-dysfunction-penile-implants(?:/index\.html|/)?$ /services/erectile-dysfunction-treatment-in-purnia;
    ~^/book-appointment(?:/index\.html|/)?$ /doctors;
    ~^/(?:conditions|treatments)(?:/index\.html|/)?$ /services/urologist-in-purnia;
    ~^/hospital(?:/index\.html|/)?$ /contact;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    if ($legacy_care_redirect != "") {
        return 301 $legacy_care_redirect$care_query_suffix;
    }
    if ($legacy_page_redirect != "") {
        return 301 $legacy_page_redirect$is_args$args;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /$is_args$args;
    }

    location ~ ^(.+)/index\.html$ {
        return 301 $1$is_args$args;
    }

    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    location = /404 {
        return 404;
    }

    location / {
        # Serve each pre-rendered page directly without directory redirects.
        try_files $uri $uri/index.html =404;
    }
}

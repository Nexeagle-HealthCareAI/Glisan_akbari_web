name: E2E VM — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: glisan-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build prerendered site
        run: npm run build

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: e2e-site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy-e2e:
    name: Build image and deploy to E2E VM
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: e2e
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: e2e-site
          path: dist/

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy image to E2E VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          password: ${{ secrets.DEV_SSH_PASSWORD }}
          port: 22
          command_timeout: 10m
          envs: IMAGE,PULL_TOKEN,ACTOR
          script: |
            set -eu
            printf '%s' "$PULL_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
            docker pull "$IMAGE"
            existing="$(docker ps -aq --filter name='^/glisan-e2e$')"
            if [ -n "$existing" ]; then
              docker rm -f "$existing"
            fi
            docker run -d --name glisan-e2e --restart unless-stopped -p 91:80 "$IMAGE"

      - name: Verify deployment
        env:
          VM_HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error "http://${VM_HOST}:91/healthz" >/dev/null \
              && curl --fail --silent --show-error "http://${VM_HOST}:91/" >/dev/null \
              && curl --fail --silent --show-error "http://${VM_HOST}:91/services" >/dev/null; then
              echo "E2E VM is serving the health endpoint and prerendered routes."
              exit 0
            fi
            echo "Deployment check ${attempt}/10 failed; retrying in 5 seconds."
            sleep 5
          done
          echo "Deployment verification failed for http://${VM_HOST}:91." >&2
          exit 1

      - name: Write deployment summary
        if: always()
        env:
          VM_HOST: ${{ secrets.DEV_SSH_HOST }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: |
          echo "## E2E VM deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: http://${VM_HOST}:91" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
